# A test phone wired unlike the real ones: its keys on the third PMIC of the bus, volume up on its ninth
# GPIO, behind an arbiter that is elsewhere and that knows this system as its third
# (tests/soc/soc-test.toml). A value of the first phones that is still written into a driver shows here
# as a key that is never read, or a write that goes nowhere.
name = "phone-keys"
description = "Test phone, keys on another PMIC"
soc = "soc-test"

features = [
    "cpufreq-epss",                 # (on a chip with two groups of cores)
    "ddr-rpmh",                     # (... and RPMh where no real chip has it)
    "buttons-pmic",
    "haptic-aw86927",               # (the same chip on other pins, another motor)
    "torch-pm8350c",                # (the part itself as the driver knows it; the way to it is this chip's)
    "speaker-aw88261",              # (the same amplifiers on another bus, at the family's other two addresses)
]

[backlight]
type = "soft"

[haptic]
sda = 110
scl = 111
reset = 9
interrupt = 200
f0_calibration = 0x1a

# (a touch controller's wiring unlike either phone's: no driver is listed for it, the drivers' tests read it)
[touch]
serial_engine = 0x00b40000
clocks = [0x29004, 0x29008, 0x2939c]
votes = [3, 4, 1, 2, 30]
bus_pins = [140, 141, 142, 143]
interrupt = 7
reset = 201
io_supply = "ldob5"
analog_supply = "ldob9"
analog_enable = 77
vendor_pins = [150, 151]

[speaker]
sda = 60
scl = 61
addresses = [0x36, 0x37]
interrupts = [70, 71]

# (its PM8350C is the bus's fourth chip, not the third)
[torch]
flash = 0x3ee
alarm = 0x30a

[buttons]
pon = 0x208                         # slave 2, registers 0x0800
pon_name = "the PMX200's power-on block"
volume_up = 0x2c8                   # slave 2, registers 0xc800: GPIO9 of a pinctrl@c000
volume_up_name = "GPIO9 of the PMX200"
