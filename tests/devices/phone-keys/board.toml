# A test phone wired unlike the real ones: its keys on the third PMIC of the bus, volume up on its ninth
# GPIO, behind an arbiter that is elsewhere and that knows this system as its third
# (tests/soc/soc-test.toml). A value of the first phones that is still written into a driver shows here
# as a key that is never read, or a write that goes nowhere.
name = "phone-keys"
description = "Test phone, keys on another PMIC"
soc = "soc-test"

features = [
    "cpufreq-epss",                 # (on a chip with two groups of cores)
    "buttons-pmic",
    "torch-pm8350c",                # (the part itself as the driver knows it; the way to it is this chip's)
]

[backlight]
type = "soft"

[buttons]
pon = 0x208                         # slave 2, registers 0x0800
pon_name = "the PMX200's power-on block"
volume_up = 0x2c8                   # slave 2, registers 0xc800: GPIO9 of a pinctrl@c000
volume_up_name = "GPIO9 of the PMX200"
