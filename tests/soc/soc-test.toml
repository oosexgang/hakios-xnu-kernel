# A chip that is nobody's: the PMIC arbiter and the CPU frequency block at addresses unlike any real
# SoC's, this system as the arbiter's third (ee = 2), two groups of cores. For the tests of what must
# come from the SoC file and not from the code (tests/buttons_driver_test.c, cpufreq_driver_test.c);
# tests/run.sh takes this directory with --soc.
name = "soc-test"
description = "A made-up chip for the tests"

# (two groups of cores, and the frequency block where no real chip has it, in larger steps)
[cpufreq]
epss = 0x05591000
epss_domain_size = 0x2000
domain_cores = [6, 2]

[spmi]
core = 0x04440000
cnfg = 0x0440a000
observer = 0x06600000
channels = 0x04600000
ee = 2
