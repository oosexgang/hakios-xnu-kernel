# devices/light/device.conf: POCO M4 5G (`light`), MediaTek Dimensity 700 (MT6833)
device light
	title	POCO M4 5G
	vendor	Xiaomi
	soc	mt6833
	defconfig	light_defconfig
	maintainer	Ankit Choudhary Phalswal & HakiOS developers
	status display works DISP_OVL0 zero-copy page flip (1080x2408 @ 60 FPS)
	status touch works FocalTech FT3518 / Novatek on SPI4 (IRQ 14, 10-finger calibrated)
	status buttons works Keypad (0x10010000) & Power via PWRAP (0x10026000)
	status cpu works 8 cores (2x A76 @ 2.2 GHz, 6x A55 @ 2.0 GHz, ARM GICv3)
	status gpu works Mali-G57 MC2 Valhall (0x13000000), Panfrost tile allocation
	status storage works UFS 2.2 (ufshci at 0x11270000), APFS rootfs mount
	status audio works MT6833 AFE (0x11210000), 32KB SRAM DMA, I2S3 48kHz, AW87389/SIA8152 Smart PA
	status wifi partial MTK CONNSYS MT6631/MT6635, SPM & MT6359 VCN rails, Apple80211 en0 IOCTL shim (WMT association in progress)
	status cellular works MT6833 CCCI / CCIF (0x10209000), 4G LTE packet data (pdp_ip0), /dev/hakios-ccci AT interface
	status battery missing MT6365 / MT6359 PMIC battery gauge
	status sensors missing
	status bluetooth missing WMT Bluetooth HCI shim
	status haptic missing
	status camera missing
	status torch missing
	status thermal missing

