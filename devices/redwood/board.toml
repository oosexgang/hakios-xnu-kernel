# POCO X5 Pro 5G. Sources: the phone's Android device tree (redwood-sm7325-sde-display.dtsi, the panel
# dsi_m20_36_02_0a_dsc_vid) and what was measured on the phone under iOS 16.5 (base/README.md).
name = "redwood"                    # what the loader puts in /chosen/darwin-board
description = "POCO X5 Pro 5G"
soc = "sm7325"

features = [
    "cpufreq-epss", "ddr-rpmh", "battery-uefi", "buttons-pmic", "adsp",
    # this phone's own parts, as its drivers have them wired
    "touch-goodix", "speaker-aw88261", "haptic-aw86927", "torch-pm8350c", "camera-redwood", "wifi-wcn6750",
    "mic-wcd938x",
    "gpu-a660",                     # the Adreno of [gpu] (gpu=1)
]

# A video-mode AMOLED panel whose brightness is MIPI DCS 0x51.
[backlight]
type = "dcs"
panel_mode = "video"
min = 8                             # qcom,mdss-dsi-bl-min-level
max = 2047                          # of qcom,mdss-dsi-bl-max-level 4095: 2047 and up is its high brightness mode
restore = 307                       # qcom,mdss-brightness-init-level
bytes = 2
byte_order = "msb-first"            # qcom,mdss-dsi-bl-inverted-dbv

[thermal]
floor_mhz = [1000, 1100, 1100]

# The keys on the PMICs: a peripheral is SPMI slave << 8 | the high byte of its registers.
[buttons]
pon = 0x013                         # pon_hlos@1300 of the PMK8350 (slave 0): power, and volume down on RESIN_N
pon_name = "the PMK8350's power-on block"
volume_up = 0x18d                   # gpio_keys: GPIO6 of the PM7325 (slave 1)
volume_up_name = "GPIO6 of the PM7325"

# The audio DSP, and the battery manager behind it.
[adsp]
firmware = "fw"
memory_size = 0x04000000            # 64 MiB of the DSP's reserved memory (adsp@86700000)

# The GPU. Sources: yupik-gpu.dtsi, Linux's adreno-gpulist.h and adreno_a6xx_gmu.c.
[gpu]
model = "Adreno 642L"
alt_model = "Adreno 643"            # qcom,gpu-models: what the parts with these speed bins are sold as
alt_bins = [0xac, 0xbe]
chip_id = 0x06030500
firmware = "fw"
gmem_kb = 512
primitive_fifo = 0x00200000
hang_cycles = 0x1fffff
speed_fuse = 0x1e9
gaming_fuse = 0x1f5
highest_bank_bit = 14               # LPDDR4X (a6xx_init)
gcc_debug_gpucc = 0x146
# (not zap_must_authenticate: this phone's firmware leaves a zap shader loaded, which is used when ours is refused)
speeds_khz = [315000, 450000, 550000]
speed_levels = [64, 128, 192]
default_speed = 3

# The loader (loader/) under this phone's UEFI. It tells boards apart by the framebuffer the UEFI reports.
[loader]
fb_base = 0xE1000000                # the loader prints it at start: "display W x H at ..."
log_other_cpu = true                # keep notes in the log partition while a kernel starts on another core
