# mtk/mt6833/soc.conf: the MediaTek MT6833 (Dimensity 700), whatever phone it is in.
# A phone with this SoC says `soc mt6833` in its device.conf and includes configs/mt6833.config from its defconfig.

soc mt6833
	title       MediaTek MT6833 family (Dimensity 700 / Dimensity 6020; "mt6833" in the device tree)
	vendor      MediaTek
	cores       8: six Cortex-A55 (cores 0-5) and two Cortex-A76 (cores 6 and 7)
	gpu         Mali-G57 MC2 (Valhall architecture)
	maintainer  the HakiOS developers
